services:
  cloudguard:
    build: .
    ports: ["127.0.0.1:8080:8080", "127.0.0.1:9091:9091"]
    environment:
      DOWNSTREAM_URL: http://downstream:8081
      OTEL_ENDPOINT: http://otel:4318/v1/traces
    depends_on: [downstream, otel]
  downstream:
    image: python:3.13-slim
    command: [python, /app/downstream.py]
    environment: {BIND: 0.0.0.0}
    volumes: ["./scripts/downstream.py:/app/downstream.py:ro"]
    ports: ["127.0.0.1:8081:8081"]
  prometheus:
    image: prom/prometheus:v3.7.2
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:12.2.1
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes: ["./monitoring/grafana:/etc/grafana/provisioning:ro"]
    ports: ["127.0.0.1:3000:3000"]
  otel:
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otel.yml"]
    volumes: ["./monitoring/otel.yml:/etc/otel.yml:ro"]
  tempo:
    image: grafana/tempo:2.9.0
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./monitoring/tempo.yml:/etc/tempo.yml:ro"]
