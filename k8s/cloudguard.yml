apiVersion: apps/v1
kind: Deployment
metadata: {name: cloudguard}
spec:
  replicas: 2
  selector:
    matchLabels: {app: cloudguard}
  template:
    metadata:
      labels: {app: cloudguard}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "9091", prometheus.io/path: /actuator/prometheus}
    spec:
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
        - name: cloudguard
          image: cloudguard:local
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8080}, {name: management, containerPort: 9091}]
          env:
            - {name: DOWNSTREAM_URL, value: "http://downstream:8081"}
            - {name: OTEL_ENDPOINT, value: "http://otel:4318/v1/traces"}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: management}
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: management}
            periodSeconds: 10
      volumes: [{name: tmp, emptyDir: {}}]
---
apiVersion: v1
kind: Service
metadata: {name: cloudguard}
spec:
  selector: {app: cloudguard}
  ports: [{name: http, port: 8080, targetPort: http}, {name: management, port: 9091, targetPort: management}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: cloudguard}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: cloudguard}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 60}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 120}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: cloudguard}
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: cloudguard}
