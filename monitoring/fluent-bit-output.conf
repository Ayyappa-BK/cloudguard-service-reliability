# Include in an existing Kubernetes Fluent Bit installation with kubernetes filter.
# Match the cloudguard pod tag; agent IAM needs CreateLogStream and PutLogEvents.
[OUTPUT]
    Name cloudwatch_logs
    Match kube.var.log.containers.cloudguard-*
    region ${AWS_REGION}
    log_group_name /cloudguard/service
    log_stream_prefix pod-
    auto_create_group false
